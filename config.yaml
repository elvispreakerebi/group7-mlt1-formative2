seed: 42

paths:
  train_csv: datasets/Devex_train.csv
  test_csv: datasets/Devex_test_questions.csv
  tables_dir: reports/tables
  figures_dir: reports/figures
  predictions_dir: reports/predictions
  model_dir: cache/models
  embedding_dir: cache/embeddings

data:
  encoding: latin1
  id_column: Unique ID
  type_column: Type
  text_column: Text
  label_prefix: Label

split:
  validation_size: 0.2

experiments:
  threshold_default: 0.5
  threshold_grid: [0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9]
  sentence_transformer_model: all-MiniLM-L6-v2
